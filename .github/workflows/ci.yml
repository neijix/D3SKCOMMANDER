# The gate (csharp/check.sh) on standard GitHub-hosted runners, on every push to master
# (all three OSes) and on demand: `gh workflow run ci.yml` (every OS) or
# `-f os='["Windows"]'`, then `gh run watch`.
# The repository is public, so ubuntu-latest, windows-latest and macos-latest are free
# and do not draw on the account's included compute. No self-hosted runner is used.
# Only a push (write access) and the Run workflow button start it. There is no
# pull_request trigger, so a fork cannot start a job or read PACKAGES_READ_TOKEN.
# Packages are never built here: ./release.sh builds them locally into dist/.
name: ci

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      os:
        description: 'Runner OSes, a JSON list of Linux, Windows, macOS'
        type: string
        default: '["Linux","Windows","macOS"]'

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # A push has no inputs: every OS.
        os: ${{ fromJSON(inputs.os || '["Linux","Windows","macOS"]') }}
    runs-on: ${{ matrix.os == 'Linux' && 'ubuntu-latest' || matrix.os == 'Windows' && 'windows-latest' || 'macos-latest' }}
    # A hung test must end the job (its log then names the long-running test).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Avalonia and Skia load these on Linux. A desktop install has them; ubuntu-latest does not.
      - name: Linux window libraries
        if: matrix.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-6 libxi6 libxrandr2 libxcursor1 libxext6 libice6 libsm6 libfontconfig1 libfreetype6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: csharp/check.sh
        shell: bash
        env:
          NuGetPackageSourceCredentials_github: Username=${{ github.repository_owner }};Password=${{ secrets.PACKAGES_READ_TOKEN }}
          DOTNET_CLI_HOME: ${{ runner.temp }}/dotnet-home
          NUGET_PACKAGES: ${{ runner.temp }}/nuget-packages
          NUGET_HTTP_CACHE_PATH: ${{ runner.temp }}/nuget-http
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
          DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
