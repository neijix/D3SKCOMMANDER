# The commit gate (./check.sh: fmt, clippy -D warnings, tests) on the owner's self-hosted Linux
# runner — this machine, no GitHub-hosted minutes. macOS and Windows: check-desktop.yml, on demand.
# A fork without that runner: set runs-on to ubuntu-latest and add release.yml's
# "Linux GUI packages" step.
name: check

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Persistent, not ephemeral: nothing may write to $HOME. The Rust toolchain and the build
    # cache live in the runner's tool cache, so a run only rebuilds what changed.
    runs-on: [self-hosted, kyber]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain and build cache in the runner's tool cache
        run: |
          {
            echo "RUSTUP_HOME=$RUNNER_TOOL_CACHE/rust/rustup"
            echo "CARGO_HOME=$RUNNER_TOOL_CACHE/rust/cargo"
            echo "CARGO_TARGET_DIR=$RUNNER_TOOL_CACHE/d3skcommander-target"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TOOL_CACHE/rust/cargo/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Gate
        run: ./check.sh
