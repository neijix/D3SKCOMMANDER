# The commit gate (./check.sh: fmt, clippy -D warnings, tests) on a GitHub-hosted Linux runner on
# every push to master. macOS and Windows: check-desktop.yml, on demand. No pull_request trigger
# and no self-hosted runner: the repository is public, so fork code never runs on the owner's machines.
name: check

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI packages
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - name: Gate
        run: ./check.sh
