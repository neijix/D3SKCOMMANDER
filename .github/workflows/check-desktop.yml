# The same gate on GitHub-hosted macOS and Windows, on demand only: `gh workflow run
# check-desktop.yml` (then `gh run watch`), run by the agent after platform-specific changes and
# before a release. The Linux gate is ./check.sh, run locally before every commit (no per-push CI).
name: check-desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --quiet
