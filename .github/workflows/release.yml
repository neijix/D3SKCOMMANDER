# Builds the release archives on a `v*` tag and publishes them as a GitHub release.
# File names: d3skcommander-<version>-<os>-<arch>.<zip|tar.gz> (csharp/packaging/publish.sh)
# and d3skcommander-<version>-windows-x86_64-setup.exe (csharp/packaging/setup-windows.sh).
# Every runtime is cross-published from one Linux job, so no macOS runner is used. The
# .deb, AppImage and .dmg installers are not built yet (plan row 91).
# A branch run (`gh workflow run release.yml --ref master`) builds and uploads the artifacts
# without publishing. Daily cap: .github/ci-quota.sh.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      force:
        description: Ignore the daily CI quota
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  quota:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/ci-quota.sh
          sparse-checkout-cone-mode: false
      - id: q
        run: ./.github/ci-quota.sh
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: release.yml
          CURRENT_RUN_ID: ${{ github.run_id }}
          MAX_RUNS: ${{ vars.CI_MAX_RUNS_PER_DAY }}
          MAX_MACOS: ${{ vars.CI_MAX_MACOS_PER_DAY }}
          FORCE: ${{ inputs.force }}

  build:
    needs: quota
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Version
        run: |
          v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' csharp/Directory.Build.props)
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$v" ]]; then
            echo "tag $GITHUB_REF does not match csharp/Directory.Build.props version $v" >&2; exit 1
          fi
      - run: csharp/check.sh
      - run: |
          for rid in linux-x64 win-x64 osx-arm64; do csharp/packaging/publish.sh "$rid"; done
          sudo apt-get update
          sudo apt-get install -y nsis
          csharp/packaging/setup-windows.sh
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-setup.exe

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "d3skcommander ${GITHUB_REF_NAME#v}" --generate-notes
