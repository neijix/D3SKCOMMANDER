[package]
name = "d3skcommander"
version = "0.1.0"
edition = "2024"
description = "A cross-platform two-panel (orthodox) file manager"
license = "MIT"
repository = "https://github.com/neijix/d3skcommander"
authors = ["neijix"]
rust-version = "1.95"

[dependencies]
eframe = "0.37"
egui_extras = { version = "0.37", features = ["image", "file"] }
trash = "5"
sysinfo = { version = "0.40", default-features = false, features = ["disk"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
open = "5"
chrono = "0.4"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
similar = "3"
filetime = "0.2"
crc32fast = "1"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
tar = "0.4"
flate2 = "1"
sevenz-rust2 = "0.24"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico", "tiff"] }
age = "0.12"
suppaftp = { version = "12", features = ["rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
rfd = "0.17"
pollster = "0.4"
egui_material_icons = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_WNet"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

# Installers (cargo install cargo-packager --locked; see README "Packages"):
# .deb + AppImage on Linux, .app + .dmg on macOS, NSIS setup.exe on Windows.
[package.metadata.packager]
productName = "d3skcommander"
identifier = "io.github.neijix.d3skcommander"
publisher = "neijix"
category = "Utility"
licenseFile = "LICENSE"
outDir = "target/packages"
beforePackagingCommand = "cargo build --release"
icons = [
  "packaging/icons/32x32.png",
  "packaging/icons/128x128.png",
  "packaging/icons/256x256.png",
  "packaging/icons/512x512.png",
  "packaging/icons/icon.icns",
  "packaging/icons/icon.ico",
]

[package.metadata.packager.nsis]
installMode = "currentUser"
installerIcon = "packaging/icons/icon.ico"

[package.metadata.packager.macos]
minimumSystemVersion = "11.0"
